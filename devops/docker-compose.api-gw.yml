services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: oregon-elasticsearch
    mem_limit: 2g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ingest.geoip.downloader.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: on-failure

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: oregon-jaeger
    ports:
      - "16686:16686"
      - "16687:16687"
      - "4317:4317"
      - "4318:4318"
    environment:
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
      - ES_INDEX_PREFIX=jaeger
      - ES_INDEX_CLEANER_SCHEDULE=0 2 * * *
    depends_on:
      - elasticsearch
    restart: on-failure

  envoy:
    image: envoyproxy/envoy:v1.38.0
    container_name: oregon-envoy
    ports:
      - "8000:10000"
      - "9901:9901"
    volumes:
      - ../configs/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - oregon-api-gw

  oregon-api-gw:
    image: ghcr.io/oregon-mai/oregon-api-gateway:latest
    deploy:
      replicas: 3
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ../configs/api-gw.yml:/app/config/local.yml:ro
      - ../logs/:/app/logs/
    depends_on:
      jaeger:
        condition: service_started

volumes:
  es-data:
