services:
  sso-service:
    image: ghcr.io/oregon-mai/oregon_sso_service:latest
    container_name: oregon-sso
    environment:
      - JAEGER=jaeger:4317
      - TZ=Europe/Moscow
    depends_on:
      - postgres-sso-service
      - jaeger
    volumes:
      - ../logs/sso.log:/app/sso.log

  postgres-sso-service:
    image: postgres:16-alpine
    container_name: postgres-sso-service
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    volumes:
      - pgdata-sso:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    command: ["postgres", "-p", "5433"]

volumes:
  pgdata-sso:
