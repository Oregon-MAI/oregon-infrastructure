services:
  oregon-resource-service:
    image: ghcr.io/oregon-mai/oregon-resource-service:latest
    container_name: oregon-resource-service
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ../configs/resource.yaml:/app/config/local.yml:ro
      - ../logs/:/app/logs/
    depends_on:
      postgres-resource-service:
        condition: service_healthy
    restart: on-failure

  postgres-resource-service:
    image: postgres:16-alpine
    container_name: oregon-resource-postgres
    mem_limit: 512m
    shm_size: 256mb
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: resource_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata-resource:/var/lib/postgresql/data
      - ../migrations/0001_resources.sql:/docker-entrypoint-initdb.d/0001_resources.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "max_connections=100"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata-resource:
