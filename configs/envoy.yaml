admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: auth_loopback_listener
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 10001
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: loopback_http
                stream_idle_timeout: 30s
                request_timeout: 10s
                route_config:
                  name: loopback_route
                  virtual_hosts:
                    - name: loopback_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: api_gw_cluster
                            timeout: 10s
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/.*$"
                              substitution: "/api/v1/auth/validate"
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(request_handle)
                          request_handle:headers():replace(":method", "POST")
                        end
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                stream_idle_timeout: 60s
                request_timeout: 30s
                drain_timeout: 10s
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/notifications/"
                          route:
                            cluster: notification_cluster
                            timeout: 30s
                            hash_policy:
                              - connection_properties:
                                  source_ip: true

                        - match:
                            prefix: "/"
                          route:
                            cluster: api_gw_cluster
                            timeout: 30s
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      token_bucket:
                        max_tokens: 2000
                        tokens_per_fill: 2000
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 0
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 0
                          denominator: HUNDRED

                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      http_service:
                        server_uri:
                          uri: http://127.0.0.1:10001
                          cluster: auth_loopback_cluster
                          timeout: 2s # ↑ Было 0.5s
                        path_prefix: /api/v1/auth/validate
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: "authorization"
                              - exact: "cookie"
                      failure_mode_allow: false

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: auth_loopback_cluster
      connect_timeout: 3s # ↑ Было 2s
      type: STATIC
      circuit_breakers:
        thresholds:
          - max_connections: 1000
            max_pending_requests: 1000
            max_requests: 1000
      load_assignment:
        cluster_name: auth_loopback_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10001

    - name: api_gw_cluster
      connect_timeout: 10s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      circuit_breakers:
        thresholds:
          - max_connections: 0
            max_pending_requests: 0
            max_requests: 0
            max_retries: 0

      http_protocol_options:
        max_requests_per_connection: 0
      load_assignment:
        cluster_name: api_gw_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: oregon-api-gw
                      port_value: 8000

    - name: notification_cluster
      connect_timeout: 30s
      type: STRICT_DNS
      lb_policy: MAGLEV
      maglev_lb_config:
        table_size: 65537
      circuit_breakers:
        thresholds:
          - max_connections: 1000
      load_assignment:
        cluster_name: notification_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: oregon-notification-service
                      port_value: 8003
