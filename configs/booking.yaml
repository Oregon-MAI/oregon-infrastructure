env: "prod"

grpc:
  port: 60017

resource_service:
  address: "oregon-resource-service:60009"

tracer:
  end-point: "jaeger:4318"
  insecure: true
  sample-ratio: 1.0

kafka:
  enabled: false
  brokers:
    - "kafka:9092"
  client_id: "oregon-booking-service"
  topics:
    user_booking: "topic.user.booking"
    admin_cancel: "topic.admin.cancel"
    user_cancel: "topic.user.cancel"
    remind_start: "topic.messages.start"
    remind_end: "topic.messages.end"

database:
  host: "booking-postgres"
  port: 5432
  user: "postgres"
  password: "postgres"
  name: "booking_service"
  ssl_mode: "disable"
